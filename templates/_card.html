<!-- Kitob kartochkasi: dizaynni shu yerda o‘zgartiring -->
<div class="col-6 col-md-4 col-lg-3 reveal" style="--i:{{ forloop.counter0 }}" data-genre="{{ b.genre.slug }}">
  <a href="{% url 'book' b.pk %}" class="card book-card h-100 text-decoration-none">
    {% include "_cover.html" with book=b extra="" %}
    <div class="card-body">
      <h6 class="card-title mb-1">{{ b.title }}</h6>
      <p class="small text-body-secondary mb-0">{{ b.author }} · {{ b.genre.name }}</p>
    </div>
  </a>
</div>
